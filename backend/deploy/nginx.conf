# ═══════════════════════════════════════════════
# Smart Planner — Nginx Config
# ═══════════════════════════════════════════════
# نصب:
# sudo cp deploy/nginx.conf /etc/nginx/sites-available/smart-planner
# sudo ln -s /etc/nginx/sites-available/smart-planner /etc/nginx/sites-enabled/
# sudo nginx -t && sudo systemctl reload nginx
# ═══════════════════════════════════════════════

server {
    listen 80;
    listen [::]:80;
    server_name planner.example.com;  # ← دامنه‌ی خودت

    # ─── Frontend (PWA static build) ───
    root /var/www/smart-planner/frontend/dist;
    index index.html;

    # ─── SPA fallback ───
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─── Service Worker — همیشه fresh ───
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~* ^/(workbox-.*\.js|registerSW\.js)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # ─── Static assets — cache طولانی ───
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2|woff|ttf|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ─── API → backend ───
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # ─── Upload limit ───
    client_max_body_size 10M;

    # ─── Security headers ───
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ─── Compression ───
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/rss+xml
        font/truetype
        font/opentype
        image/svg+xml
        application/vnd.ms-fontobject;

    # ─── Logs ───
    access_log /var/log/nginx/smart-planner-access.log;
    error_log /var/log/nginx/smart-planner-error.log;
}

# ⚠️ بعد از certbot، خودش این بلاک را برای HTTPS اضافه می‌کند
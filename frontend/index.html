  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    
    <!-- ✅ Service Worker Registration (فقط در Production) -->
    <script>
      (function() {
        // تشخیص محیط Development
        var isDev = 
          location.hostname === 'localhost' || 
          location.hostname === '127.0.0.1' ||
          location.hostname.startsWith('192.168.') ||
          location.hostname.startsWith('10.') ||
          location.hostname.endsWith('.local');
        
        if (!('serviceWorker' in navigator)) {
          return;
        }
        
        if (!isDev) {
          // ✅ Production: ثبت Service Worker
          window.addEventListener('load', function() {
            navigator.serviceWorker
              .register('/sw.js')
              .then(function(registration) {
                console.log('✅ ServiceWorker registered:', registration.scope);
              })
              .catch(function(error) {
                console.log('❌ ServiceWorker registration failed:', error);
              });
          });
        } else {
          // ✅ Development: حذف Service Worker های قبلی و پاک کردن cache
          console.log('🔧 Dev mode detected - cleaning up Service Workers...');
          
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            if (registrations.length === 0) {
              console.log('✅ No Service Workers to unregister');
              return;
            }
            
            registrations.forEach(function(registration) {
              registration.unregister().then(function(success) {
                if (success) {
                  console.log('🗑️ ServiceWorker unregistered:', registration.scope);
                }
              });
            });
            
            // بعد از unregister، صفحه رو reload کن
            setTimeout(function() {
              if (sessionStorage.getItem('sw-cleaned') !== 'true') {
                sessionStorage.setItem('sw-cleaned', 'true');
                window.location.reload();
              }
            }, 500);
          });
          
          // پاک کردن cache ها
          if (window.caches) {
            caches.keys().then(function(names) {
              names.forEach(function(name) {
                caches.delete(name);
                console.log('🗑️ Cache deleted:', name);
              });
            });
          }
        }
      })();
    </script>
  </body>
